<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>决策工作台 - Enterprise Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- 核心设计系统 (Apple Aesthetic) --- */
        :root {
            --bg-body: #F5F5F7;
            --bg-card: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #424245;
            --text-tertiary: #86868B;
            --accent-blue: #0066CC;
            --accent-green: #28CD41;
            --accent-red: #FF3B30;
            --accent-orange: #FF9500;
            --border-light: rgba(0, 0, 0, 0.08); 
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;
            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-stack); -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-body); color: var(--text-primary); min-height: 100vh; display: flex; }

        /* --- 侧边栏 --- */
        .sidebar {
            width: 240px; background: var(--bg-card); padding: 32px 16px;
            display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
            z-index: 50; box-shadow: 1px 0 0 var(--border-light);
        }
        .logo h1 { font-size: 20px; font-weight: 700; padding: 0 16px 32px; letter-spacing: -0.5px; }
        .nav-item {
            display: flex; align-items: center; padding: 10px 16px; margin-bottom: 4px;
            color: var(--text-secondary); text-decoration: none; font-size: 14px;
            font-weight: 500; border-radius: 10px; transition: 0.2s;
        }
        .nav-item i { width: 22px; margin-right: 10px; font-size: 15px; opacity: 0.7; }
        .nav-item:hover { background-color: rgba(0, 0, 0, 0.03); }
        .nav-item.active { background-color: rgba(0, 102, 204, 0.08); color: var(--accent-blue); font-weight: 600; }

        /* --- 主内容区 --- */
        .main-content { flex: 1; padding: 32px 40px; overflow-y: auto; max-width: 1400px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .header-title h2 { font-size: 26px; font-weight: 700; }
        .header-title p { color: var(--text-tertiary); font-size: 13px; margin-top: 2px; }

        /* --- 指标卡片 --- */
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
        .metric-card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); }
        .metric-value { font-size: 28px; font-weight: 700; margin: 4px 0; }
        .metric-label { font-size: 11px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; }

        /* --- 仪表盘布局 --- */
        .dashboard-layout { display: grid; grid-template-columns: 2.2fr 1fr; gap: 24px; }
        .dashboard-card { background: var(--bg-card); border-radius: var(--radius-xl); padding: 28px; box-shadow: var(--shadow-sm); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card-title { font-size: 17px; font-weight: 700; }

        /* --- 流程列表 (UI 优化版) --- */
        .process-list { display: flex; flex-direction: column; gap: 14px; }
        .process-item {
            background: white; border: 1px solid var(--border-light);
            border-radius: 16px; padding: 22px 26px; transition: all 0.2s;
        }
        .process-item:hover { box-shadow: var(--shadow-md); border-color: transparent; }

        .process-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .process-name { font-size: 16px; font-weight: 700; color: var(--text-primary); }
        
        /* 元数据栏：区分标签与内容 */
        .process-meta-compact {
            display: flex; align-items: center; flex-wrap: wrap; gap: 20px; font-size: 12px;
            margin-bottom: 16px;
        }
        .meta-info-item { display: flex; align-items: center; gap: 6px; }
        .meta-info-item i { font-size: 14px; color: var(--accent-blue); opacity: 0.6; }
        .meta-label { font-weight: 500; color: var(--text-tertiary); margin-right: 2px; }
        .meta-value { color: var(--text-secondary); font-weight: 700; }

        /* 评审团：不换行排版 */
        .reviewer-section { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 16px; 
            padding: 10px 14px;
            background: #F9F9FB;
            border-radius: 10px;
        }
        .reviewer-label { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--text-tertiary); 
            text-transform: uppercase; 
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .reviewer-label i { color: var(--accent-blue); font-size: 12px; }
        .reviewer-cloud { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        
        .reviewer-tag {
            display: inline-flex; align-items: center; gap: 5px; 
            font-size: 12px; padding: 3px 10px; border-radius: 6px; transition: 0.2s;
        }
        .reviewer-tag.approved { color: var(--text-tertiary); background: #E8E8ED; }
        .reviewer-tag.approved i { color: var(--accent-green); font-size: 10px; }
        .reviewer-tag.pending { 
            color: var(--accent-orange); background: #FFF9F0; 
            font-weight: 700; box-shadow: 0 0 0 1px rgba(255, 149, 0, 0.2);
        }
        .reviewer-tag.pending i { font-size: 11px; }

        /* 标签与进度条 */
        .tag-badge { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
        
        .mini-progress { height: 4px; background: #F2F2F7; border-radius: 2px; overflow: hidden; margin-top: 4px; }
        .bar-segment { height: 100%; transition: width 0.6s ease; }

        /* 按钮控制 */
        .btn-quick-view {
            height: 30px; padding: 0 16px; border-radius: 15px; border: none;
            background: rgba(0, 102, 204, 0.1); color: var(--accent-blue);
            font-size: 11px; font-weight: 700; cursor: pointer;
        }
        .btn-quick-view:hover { background: var(--accent-blue); color: white; }

        @media (max-width: 1000px) { 
            .dashboard-layout { grid-template-columns: 1fr; } 
            .reviewer-section { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo"><h1>决策平台</h1></div>
        <nav>
            <a href="#" class="nav-item active"><i class="fas fa-home"></i> 工作台</a>
            <a href="#" class="nav-item"><i class="fas fa-project-diagram"></i> 决策流程</a>
            <a href="#" class="nav-item"><i class="fas fa-chart-pie"></i> 统计分析</a>
            <a href="#" class="nav-item"><i class="fas fa-calendar-alt"></i> 评审计划</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="header-title">
                <h2>工作台</h2>
                <p>实时同步：2026年2月3日</p>
            </div>
            <button class="btn-quick-view">待办速览</button>
        </div>

        <div class="metrics-grid">
            <div class="metric-card"><div class="metric-label">进行中</div><div class="metric-value">24</div></div>
            <div class="metric-card"><div class="metric-label">本月完成</div><div class="metric-value">18</div></div>
            <div class="metric-card"><div class="metric-label">效率趋势</div><div class="metric-value">6.5d</div></div>
            <div class="metric-card"><div class="metric-label">通过率</div><div class="metric-value">87%</div></div>
        </div>

        <div class="dashboard-layout">
            <div class="dashboard-card">
                <div class="card-header"><div class="card-title">最近决策进展</div></div>
                <div class="process-list" id="processList"></div>
            </div>

            <div class="right-panel">
                <div class="dashboard-card" style="margin-bottom: 24px; padding: 20px;">
                    <div class="card-title" style="font-size: 15px; margin-bottom: 12px; color: var(--accent-red);">风险提醒</div>
                    <div style="font-size: 13px; color: var(--text-secondary);">
                        <i class="fas fa-exclamation-circle" style="margin-right: 6px;"></i>3项任务已逾期
                    </div>
                </div>
                <div class="dashboard-card" style="padding: 20px;">
                    <div class="card-title" style="font-size: 15px; margin-bottom: 16px;">效率趋势</div>
                    <div style="height: 140px;"><canvas id="effChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const processData = [
            { id: '2335795', name: '2025年度全面预算评审', typeName: '经营决策', statusText: '进行中', manager: '李奕凝', date: '2026-01-29', color: '#FF9500', progress: 60, reviewers: '李婷婷, 迟煦, 王震', approver: '李婷婷' },
            { id: '2314300', name: 'OLED生产线采购项目', typeName: '销售订单', statusText: '进行中', manager: '李婷婷', date: '2026-01-13', color: '#0066CC', progress: 40, reviewers: '周飞, 李婷婷, 胡兴, 蔡军', approver: '胡兴, 李婷婷' },
            { id: '2308950', name: '新一代显示技术研发', typeName: '研发立项', statusText: '已结项', manager: '陈峰', date: '2026-01-08', color: '#30D158', progress: 100, reviewers: '潘双, 刘明', approver: '' }
        ];

        function renderList() {
            const list = document.getElementById('processList');
            list.innerHTML = processData.map(item => {
                const allRev = item.reviewers.split(',').map(r => r.trim());
                const pendingRev = item.approver.split(',').map(a => a.trim());

                // 处理评审名单
                const reviewerTags = allRev.map(name => {
                    const isPending = pendingRev.includes(name);
                    return isPending 
                        ? `<span class="reviewer-tag pending"><i class="fas fa-clock"></i>${name}</span>`
                        : `<span class="reviewer-tag approved"><i class="fas fa-check"></i>${name}</span>`;
                }).join('');

                return `
                <div class="process-item">
                    <div class="process-top">
                        <div class="process-name">${item.name}</div>
                        <span class="tag-badge" style="background: ${item.color}15; color: ${item.color}">${item.typeName}</span>
                    </div>

                    <div class="process-meta-compact">
                        <div class="meta-info-item">
                            <i class="far fa-user"></i>
                            <span class="meta-label">模块负责人:</span>
                            <span class="meta-value">${item.manager}</span>
                        </div>
                        <div class="meta-info-item">
                            <i class="far fa-calendar-alt"></i>
                            <span class="meta-label">创建时间:</span>
                            <span class="meta-value">${item.date}</span>
                        </div>
                        <div class="meta-info-item">
                            <i class="fas fa-hashtag"></i>
                            <span class="meta-label">流水号:</span>
                            <span class="meta-value" style="font-family: 'SF Mono', monospace;">${item.id}</span>
                        </div>
                    </div>

                    <div class="reviewer-section">
                        <span class="reviewer-label"><i class="fas fa-users-cog"></i> 评审团:</span>
                        <div class="reviewer-cloud">
                            ${reviewerTags}
                        </div>
                    </div>

                    <div class="mini-progress">
                        <div class="bar-segment" style="width: ${item.progress}%; background: ${item.color}"></div>
                    </div>
                </div>
                `;
            }).join('');
        }

        renderList();

        const ctx = document.getElementById('effChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['W1', 'W2', 'W3', 'W4'],
                datasets: [{ data: [8, 7, 7.5, 6.5], borderColor: '#0066CC', borderWidth: 2, pointRadius: 0, tension: 0.4, fill: false }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { display: false }, y: { display: false } }, plugins: { legend: { display: false } } }
        });
    </script>
</body>
</html>
